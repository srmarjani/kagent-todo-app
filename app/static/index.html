<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <style>
    body { font-family: sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    #stats { color: #555; margin: 0; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    #title-input { flex: 1; min-width: 10rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid #ddd; }
    li.done .todo-title { text-decoration: line-through; color: #888; }
    .todo-title { flex: 1; }
    .todo-due { color: #555; font-size: 0.85rem; }
    li.overdue .todo-due { color: #b00020; font-weight: bold; }
    #error { color: #b00020; min-height: 1.2rem; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Todo</h1>
    <p id="stats" aria-live="polite">– open · – done</p>
  </header>

  <form id="add-form">
    <label for="title-input">Title</label>
    <input id="title-input" type="text" required>
    <label for="due-input">Due date</label>
    <input id="due-input" type="date">
    <button id="add-button" type="submit">Add</button>
  </form>

  <div class="toolbar">
    <p>
      <label for="filter-select">Show</label>
      <select id="filter-select">
        <option value="all">All</option>
        <option value="open">Open</option>
        <option value="done">Done</option>
      </select>
    </p>
    <button id="clear-completed" type="button" disabled>Clear completed</button>
  </div>

  <p id="error" role="alert"></p>
  <ul id="todo-list"></ul>
  <p id="empty-message" hidden>No todos.</p>

  <script src="/app.js"></script>
</body>
</html>
